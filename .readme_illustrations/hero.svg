<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">Freqtrade Ultimate</title>
  <desc id="d">Banner: the orange Freqtrade Ultimate robot mascot in front of a candlestick chart, wired to four smaller bots labelled trend, mean-rev, DCA and short. Tagline: the production-grade Freqtrade fork for algorithmic trading on Hyperliquid.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; }
      .eye { animation: blink 5.5s infinite; transform-box: fill-box; transform-origin: center; }
      .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .flow { stroke-dasharray: 2 10; stroke-linecap: round; animation: dash 1.4s linear infinite; }
      .float1 { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 4.6s ease-in-out infinite -1.2s; }
      .float3 { animation: float 5.2s ease-in-out infinite -2.4s; }
      .float4 { animation: float 4.3s ease-in-out infinite -3.1s; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
      @keyframes ping { 0% { transform: scale(1); opacity: 0.55; } 80%, 100% { transform: scale(2.3); opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }

      .live { animation: live 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
      .draw { stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw 7s ease-out infinite; }
      .spin { animation: spin 60s linear infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes live { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.35); } }
      @keyframes draw { 0% { stroke-dashoffset: 1600; } 60%, 100% { stroke-dashoffset: 0; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .draw { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
