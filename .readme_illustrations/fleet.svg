      <ellipse class="eye" cx="242" cy="196" rx="11" ry="19" fill="#FFF8E7" stroke="none"/>
    </g>
    <clipPath id="disc"><circle cx="200" cy="200" r="197"/></clipPath>
    <g id="avatar">
      <circle cx="200" cy="200" r="200" fill="#5BC0CB"/>
      <g clip-path="url(#disc)"><use href="#bot"/></g>
      <circle cx="200" cy="200" r="197" fill="none" stroke="#0B2545" stroke-width="10"/>
    </g>

