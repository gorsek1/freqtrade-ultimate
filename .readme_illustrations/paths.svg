<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 724" width="1280" height="724" role="img" aria-labelledby="t d">
  <title id="t">Choose your path</title>
  <desc id="d">Everyone clones the repository with --filter=blob:none. Already running freqtrade: migrate without losing anything, natively in a new folder or with Docker by swapping the image. New to freqtrade: start fresh with setup.sh or docker compose build.</desc>
  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace; }
      .eye { animation: blink 5.5s infinite; transform-box: fill-box; transform-origin: center; }
      .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
      .flow { stroke-dasharray: 2 10; stroke-linecap: round; animation: dash 1.4s linear infinite; }
      .float1 { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 4.6s ease-in-out infinite -1.2s; }
      .float3 { animation: float 5.2s ease-in-out infinite -2.4s; }
      .float4 { animation: float 4.3s ease-in-out infinite -3.1s; }
      @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(0.12); } }
      @keyframes ping { 0% { transform: scale(1); opacity: 0.55; } 80%, 100% { transform: scale(2.3); opacity: 0; } }
      @keyframes dash { to { stroke-dashoffset: -24; } }
      @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B2545"/>
      <stop offset="1" stop-color="#071A30"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFF8E7" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <g id="bot" stroke="#0B2545" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <line x1="200" y1="70" x2="200" y2="104" fill="none"/>
      <circle class="ping" cx="200" cy="49" r="23" fill="#F7901E" stroke="none"/>
      <circle cx="200" cy="49" r="23" fill="#F7901E"/>
      <path d="M57 406 L62 336 C65 301 86 282 120 278 L280 278 C314 282 335 301 338 336 L343 406 Z" fill="#F7901E"/>
      <path d="M117 281 C109 320 105 362 103 406" fill="none"/>
      <path d="M283 281 C291 320 295 362 297 406" fill="none"/>
      <path d="M63 328 C78 333 92 337 106 339" fill="none"/>
      <path d="M294 339 C308 337 322 333 337 328" fill="none"/>
      <ellipse cx="84" cy="198" rx="28" ry="36" fill="#F7901E"/>
      <ellipse cx="316" cy="198" rx="28" ry="36" fill="#F7901E"/>
      <path d="M200 100 C285 100 318 140 318 190 C318 249 281 286 200 286 C119 286 82 249 82 190 C82 140 115 100 200 100 Z" fill="#F7901E"/>
      <rect x="110" y="142" width="180" height="105" rx="52" fill="#0B2545" stroke="none"/>
      <ellipse class="eye" cx="158" cy="196" rx="11" ry="19" fill="#FFF8E7" stroke="none"/>
      <ellipse class="eye" cx="242" cy="196" rx="11" ry="19" fill="#FFF8E7" stroke="none"/>
    </g>
    <clipPath id="disc"><circle cx="200" cy="200" r="197"/></clipPath>
    <g id="avatar">
      <circle cx="200" cy="200" r="200" fill="#5BC0CB"/>
      <g clip-path="url(#disc)"><use href="#bot"/></g>
      <circle cx="200" cy="200" r="197" fill="none" stroke="#0B2545" stroke-width="10"/>
    </g>

  </defs>
  <rect width="1280" height="724" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="724" rx="28" fill="url(#grid)"/>
<rect x="225.1" y="34" width="829.8" height="46" rx="23" fill="#071A30" stroke="#5BC0CB" stroke-width="1.5"/>
<text x="640" y="63" class="mono" font-size="16" fill="#FFF8E7" text-anchor="middle">git clone --filter=blob:none https://github.com/titouannwtt/freqtrade-ultimate.git</text>
<text x="640" y="108" class="sans" font-size="16" fill="#8FA6C4" text-anchor="middle">~2 GB full working tree  ·  ~130 MB with a sparse checkout (code without the data bundle)</text>
<path class="flow" d="M640 214 C640 250 330 236 330 270" stroke="#F7901E" stroke-width="3" fill="none"/>
<path class="flow" d="M640 214 C640 250 950 236 950 270" stroke="#5BC0CB" stroke-width="3" fill="none"/>
<line x1="640" y1="118" x2="640" y2="134" stroke="#8FA6C4" stroke-width="2"/>
<g class="float1"><use href="#avatar" transform="translate(594.0 130.0) scale(0.2300)"/></g>
<text x="560" y="182" class="sans" font-size="16" fill="#FFB45E" font-weight="600" text-anchor="end">already running?</text>
<text x="720" y="182" class="sans" font-size="16" fill="#5BC0CB" font-weight="600">brand new?</text>
<rect x="48" y="270" width="568" height="418" rx="22" fill="#0F3157" stroke="#F7901E" stroke-width="2"/>
<text x="78" y="318" class="mono" font-size="15" fill="#F7901E" font-weight="700" letter-spacing="2">ALREADY RUNNING FREQTRADE?</text>
<text x="78" y="360" class="sans" font-size="32" fill="#FFF8E7" font-weight="800">Migrate, lose nothing</text>
<text x="78" y="394" class="sans" font-size="17" fill="#C3D2E6">Same command, config schema and database.</text>
<text x="78" y="418" class="sans" font-size="17" fill="#C3D2E6">Your user_data/ and trade DB are reused as-is.</text>
<rect x="72" y="450" width="520" height="78" rx="14" fill="#071A30" stroke="#24507F" stroke-width="1.5"/>
<rect x="88" y="465" width="65.0" height="22" rx="11" fill="#F7901E"/>
<text x="120.5" y="481" class="mono" font-size="13" fill="#0B2545" font-weight="700" text-anchor="middle">NATIVE</text>
<text x="169.0" y="482" class="mono" font-size="16" fill="#FFF8E7">./setup.sh -i</text>
<text x="88" y="513" class="sans" font-size="16" fill="#C3D2E6">in a new folder, then run your bot with --userdir</text>
<rect x="72" y="540" width="520" height="78" rx="14" fill="#071A30" stroke="#24507F" stroke-width="1.5"/>
<rect x="88" y="555" width="65.0" height="22" rx="11" fill="#F7901E"/>
<text x="120.5" y="571" class="mono" font-size="13" fill="#0B2545" font-weight="700" text-anchor="middle">DOCKER</text>
<text x="169.0" y="572" class="mono" font-size="16" fill="#FFF8E7">docker build -t freqtrade-ultimate:latest .</text>
<text x="88" y="603" class="sans" font-size="16" fill="#C3D2E6">swap the image line, then docker compose up -d</text>
<circle cx="86" cy="650" r="7" fill="#3DDC97"/>
<text x="102" y="656" class="sans" font-size="16" fill="#FFF8E7" font-weight="600">Rollback: start the old install or image again</text>
<rect x="664" y="270" width="568" height="418" rx="22" fill="#0F3157" stroke="#5BC0CB" stroke-width="2"/>
<text x="694" y="318" class="mono" font-size="15" fill="#5BC0CB" font-weight="700" letter-spacing="2">NEW TO FREQTRADE?</text>
<text x="694" y="360" class="sans" font-size="32" fill="#FFF8E7" font-weight="800">Start fresh</text>
<text x="694" y="394" class="sans" font-size="17" fill="#C3D2E6">A complete installation on its own:</text>
<text x="694" y="418" class="sans" font-size="17" fill="#C3D2E6">no need to install upstream freqtrade first.</text>
<rect x="688" y="450" width="520" height="78" rx="14" fill="#071A30" stroke="#24507F" stroke-width="1.5"/>
<rect x="704" y="465" width="65.0" height="22" rx="11" fill="#5BC0CB"/>
<text x="736.5" y="481" class="mono" font-size="13" fill="#0B2545" font-weight="700" text-anchor="middle">NATIVE</text>
<text x="785.0" y="482" class="mono" font-size="16" fill="#FFF8E7">./setup.sh -i</text>
<text x="704" y="513" class="sans" font-size="16" fill="#C3D2E6">create-userdir, new-config, then freqtrade trade</text>
<rect x="688" y="540" width="520" height="78" rx="14" fill="#071A30" stroke="#24507F" stroke-width="1.5"/>
<rect x="704" y="555" width="65.0" height="22" rx="11" fill="#5BC0CB"/>
<text x="736.5" y="571" class="mono" font-size="13" fill="#0B2545" font-weight="700" text-anchor="middle">DOCKER</text>
<text x="785.0" y="572" class="mono" font-size="16" fill="#FFF8E7">docker compose build</text>
<text x="704" y="603" class="sans" font-size="16" fill="#C3D2E6">create-userdir, new-config, then docker compose up -d</text>
<circle cx="702" cy="650" r="7" fill="#F7901E"/>
<text x="718" y="656" class="sans" font-size="16" fill="#FFF8E7" font-weight="600">Then: freqtrade install-ui for the dashboard</text>
</svg>
